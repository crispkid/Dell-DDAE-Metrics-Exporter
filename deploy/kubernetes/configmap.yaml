apiVersion: v1
kind: ConfigMap
metadata:
  name: ddae-exporter
data:
  config.yaml: |
    version: 1

    monitoring:
      # Resources and alerts default to true; Serviceability Logs defaults to
      # false. Queries also default to false. Keep at least one pipeline enabled.
      resources:
        enabled: true
        interval: 30s
        stale_after: 120s
      alerts:
        enabled: true
        interval: 30s
        list_response_max_bytes: 8388608
        detail:
          response_max_bytes: 1048576
          refresh_interval: 10m
          max_per_cycle: 200
          concurrency: 4
      serviceability_logs:
        backfill:
          enabled: false
          lookback: 24h
          overlap: 2m
          interval: 30s
          cycle_timeout: 20s
          rescan_interval: 1h
          max_pages_per_cycle: 4
          detail_max_per_cycle: 25
          detail_concurrency: 2
          max_pending_records: 10000
        enabled: false
        interval: 30s
        list_response_max_bytes: 8388608
        detail:
          response_max_bytes: 1048576
          refresh_interval: 10m
          max_per_cycle: 200
          concurrency: 4

      queries:
        backfill:
          enabled: false
          lookback: 24h
          overlap: 2m
          interval: 30s
          cycle_timeout: 20s
          rescan_interval: 1h
          max_pages_per_cycle: 4
          detail_max_per_cycle: 25
          detail_concurrency: 2
          max_pending_records: 10000
        # Prometheus: concurrency, queue counts and observed duration histograms.
        enabled: false
        # Kafka: sanitized per-query details (including user); SQL is excluded.
        events_enabled: false
        base_url: https://insights.example.invalid
        auth_url: https://identity.example.invalid
        realm: ddae
        # Replace with an authorized role that can view all queries.
        role: monitoring
        username_file: /run/secrets/query/username
        password_file: /run/secrets/query/password
        ca_file: /run/trust/insights-ca.pem
        auth_ca_file: /run/trust/identity-ca.pem
        insecure_skip_verify: false
        kafka_topic: ddae-queries
        interval: 30s
        request_timeout: 5s
        cycle_timeout: 20s
        stale_after: 90s
        response_max_bytes: 16777216
        max_history_records: 1000
        detail_max_per_cycle: 100
        detail_concurrency: 4
        retry_max: 2
        checkpoint_retention: 720h
        checkpoint_max_records: 100000
        outbox_max_bytes: 268435456
        outbox_max_events: 10000

    server:
      listen_address: 0.0.0.0:9469
      shutdown_grace_period: 15s

    security:
      allow_insecure_tls: false

    ddae:
      base_url: https://ddae.example.invalid
      paths:
        # Defaults produce /ping and /v1/*. Set both to /rest/v1 only for an
        # older gateway that still requires the v1.0.0-rc2 route namespace.
        ping_prefix: ""
        api_prefix: /v1
      source_instance: replace-with-stable-appliance-name
      credentials:
        username_file: /run/secrets/ddae/username
        password_file: /run/secrets/ddae/password
        client_secret_file: /run/secrets/ddae/client-secret
      tls:
        ca_file: /run/trust/ddae-ca.pem
        # Requires security.allow_insecure_tls: true as a second opt-in.
        insecure_skip_verify: false
      request_timeout: 5s
      cycle_timeout: 20s
      response_max_bytes: 4194304
      retry_max: 2

    kafka:
      brokers:
        - kafka.example.invalid:9093
      topic: ddae-serviceability-alerts
      serviceability_logs_topic: ddae-serviceability-logs
      client_id: ddae-exporter
      tls:
        ca_file: /run/trust/kafka-ca.pem
        # Optional mTLS: set both paths to mounted files in /run/secrets/kafka.
        client_cert_file: ""
        client_key_file: ""
        # Target-scoped; never disables DDAE verification.
        insecure_skip_verify: false
      sasl:
        mechanism: SCRAM-SHA-512
        username: replace-with-runtime-identity
        password_file: /run/secrets/kafka/password
      publish_timeout: 10s

    state:
      dir: /var/lib/ddae-exporter
      outbox_max_bytes: 1073741824
      outbox_max_events: 100000
      checkpoint_retention: 720h
      checkpoint_max_alerts: 100000
      serviceability_logs_outbox_max_bytes: 1073741824
      serviceability_logs_outbox_max_events: 100000
      serviceability_logs_checkpoint_retention: 720h
      serviceability_logs_checkpoint_max_records: 100000

    logging:
      level: info
      format: json
