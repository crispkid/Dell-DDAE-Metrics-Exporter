version: 1

monitoring:
  # Resources and alerts default to true; Serviceability Logs defaults to
  # false. Queries also default to false. At least one pipeline must remain enabled.
  resources:
    enabled: true
    interval: 30s
    stale_after: 120s
  alerts:
    enabled: true
    interval: 30s
    list_response_max_bytes: 8388608
    detail:
      response_max_bytes: 1048576
      refresh_interval: 10m
      max_per_cycle: 200
      concurrency: 4
  serviceability_logs:
    backfill:
      enabled: false
      lookback: 24h
      overlap: 2m
      interval: 30s
      cycle_timeout: 20s
      rescan_interval: 1h
      max_pages_per_cycle: 4
      detail_max_per_cycle: 25
      detail_concurrency: 2
      max_pending_records: 10000
    enabled: false
    interval: 30s
    list_response_max_bytes: 8388608
    detail:
      response_max_bytes: 1048576
      refresh_interval: 10m
      max_per_cycle: 200
      concurrency: 4

  queries:
    backfill:
      enabled: false
      lookback: 24h
      overlap: 2m
      interval: 30s
      cycle_timeout: 20s
      rescan_interval: 1h
      max_pages_per_cycle: 4
      detail_max_per_cycle: 25
      detail_concurrency: 2
      max_pending_records: 10000
    # Prometheus: concurrency, queue counts and observed duration histograms.
    enabled: false
    # Kafka: sanitized per-query details (including user); SQL is excluded.
    events_enabled: false
    base_url: https://insights.example.invalid
    auth_url: https://identity.example.invalid
    realm: ddae
    # Replace with an authorized role that can view all queries.
    role: monitoring
    username_file: /secure/runtime/query-username
    password_file: /secure/runtime/query-password
    ca_file: /etc/ddae-exporter/trust/insights-ca.pem
    auth_ca_file: /etc/ddae-exporter/trust/identity-ca.pem
    insecure_skip_verify: false
    kafka_topic: ddae-queries
    interval: 30s
    request_timeout: 5s
    cycle_timeout: 20s
    stale_after: 90s
    response_max_bytes: 16777216
    max_history_records: 1000
    detail_max_per_cycle: 100
    detail_concurrency: 4
    retry_max: 2
    checkpoint_retention: 720h
    checkpoint_max_records: 100000
    outbox_max_bytes: 268435456
    outbox_max_events: 10000

server:
  listen_address: 127.0.0.1:9469
  shutdown_grace_period: 15s

security:
  # Keep false in production. A target-specific insecure flag also requires
  # this acknowledgement, and insecure runs cannot provide release evidence.
  allow_insecure_tls: false

ddae:
  base_url: https://ddae.example.invalid
  paths:
    # Defaults produce /ping and /v1/*. Use /rest/v1 for both values when
    # preserving v1.0.0-rc2 routes behind an older gateway.
    ping_prefix: ""
    api_prefix: /v1
  source_instance: replace-with-stable-appliance-name
  credentials:
    # systemd LoadCredential overrides these example paths through the unit's
    # higher-precedence environment settings.
    username_file: /secure/runtime/ddae-username
    password_file: /secure/runtime/ddae-password
    client_secret_file: /secure/runtime/ddae-client-secret
  tls:
    ca_file: /etc/ddae-exporter/trust/ddae-ca.pem
    # Effective only together with security.allow_insecure_tls: true. Prefer
    # installing the correct CA; insecure runs are not release evidence.
    insecure_skip_verify: false
  request_timeout: 5s
  cycle_timeout: 20s
  response_max_bytes: 4194304
  retry_max: 2

kafka:
  brokers:
    - kafka.example.invalid:9093
  topic: ddae-serviceability-alerts
  serviceability_logs_topic: ddae-serviceability-logs
  client_id: ddae-exporter
  tls:
    ca_file: /etc/ddae-exporter/trust/kafka-ca.pem
    # Optional mTLS: set both paths together; blank uses no client certificate.
    client_cert_file: ""
    client_key_file: ""
    # This target flag never affects DDAE TLS verification.
    insecure_skip_verify: false
  sasl:
    mechanism: SCRAM-SHA-512
    username: replace-with-runtime-identity
    # systemd LoadCredential overrides this example path.
    password_file: /secure/runtime/kafka-password
  publish_timeout: 10s

state:
  dir: /var/lib/ddae-exporter
  outbox_max_bytes: 1073741824
  outbox_max_events: 100000
  checkpoint_retention: 720h
  checkpoint_max_alerts: 100000
  serviceability_logs_outbox_max_bytes: 1073741824
  serviceability_logs_outbox_max_events: 100000
  serviceability_logs_checkpoint_retention: 720h
  serviceability_logs_checkpoint_max_records: 100000

logging:
  level: info
  format: json
