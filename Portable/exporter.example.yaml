version: 1
monitoring:
  resources:
    enabled: true
    interval: 30s
    stale_after: 120s
  alerts:
    enabled: false
  serviceability_logs:
    enabled: false
server:
  listen_address: 127.0.0.1:9469
  shutdown_grace_period: 15s
security:
  allow_insecure_tls: false
ddae:
  base_url: https://ddae.example.invalid
  paths:
    ping_prefix: ""
    api_prefix: /v1
  source_instance: portable-resource-check
  credentials:
    username_file: secrets/ddae-username
    password_file: secrets/ddae-password
    client_secret_file: secrets/ddae-client-secret
  tls:
    ca_file: ""
    insecure_skip_verify: false
  request_timeout: 5s
  cycle_timeout: 20s
  response_max_bytes: 4194304
  retry_max: 2
logging:
  level: info
  format: json
