<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title description">
  <title id="title">Dell DDAE Metrics Exporter architecture</title>
  <desc id="description">DDAE data flows through the exporter resource, alert, and serviceability log pipelines to Prometheus and Kafka consumers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .group { fill: #f8fafc; stroke: #64748b; stroke-width: 2; stroke-dasharray: 8 6; }
      .source { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; }
      .process { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
      .state { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; }
      .output { fill: #ecfdf5; stroke: #059669; stroke-width: 2; }
      .event { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; }
      .flow { fill: none; stroke: #475569; stroke-width: 2.5; marker-end: url(#arrow); }
      .heading { fill: #0f172a; font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .group-title { fill: #334155; font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #0f172a; font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="canvas" width="1440" height="720"/>
  <text class="heading" x="720" y="48" text-anchor="middle">Dell DDAE Metrics Exporter</text>

  <rect class="group" x="270" y="78" width="870" height="580" rx="18"/>
  <text class="group-title" x="300" y="114">Exporter process</text>

  <rect class="source" x="30" y="286" width="190" height="88" rx="12"/>
  <text class="label" x="125" y="322">DDAE</text>
  <text class="small" x="125" y="348">Management API</text>

  <rect class="process" x="310" y="286" width="190" height="88" rx="12"/>
  <text class="label" x="405" y="322">OAuth and read-only</text>
  <text class="small" x="405" y="348">API client</text>

  <rect class="process" x="550" y="146" width="190" height="88" rx="12"/>
  <text class="label" x="645" y="181">Resource</text>
  <text class="small" x="645" y="207">collectors</text>

  <rect class="process" x="790" y="146" width="160" height="88" rx="12"/>
  <text class="label" x="870" y="181">Current</text>
  <text class="small" x="870" y="207">snapshot</text>

  <rect class="process" x="990" y="146" width="120" height="88" rx="12"/>
  <text class="label" x="1050" y="181">HTTP</text>
  <text class="small" x="1050" y="207">server</text>

  <rect class="process" x="550" y="286" width="190" height="88" rx="12"/>
  <text class="label" x="645" y="322">Alert pipeline</text>
  <text class="small" x="645" y="348">list and detail</text>

  <rect class="state" x="790" y="286" width="220" height="88" rx="12"/>
  <text class="label" x="900" y="322">Durable outbox</text>
  <text class="small" x="900" y="348">state.db</text>

  <rect class="process" x="550" y="456" width="190" height="88" rx="12"/>
  <text class="label" x="645" y="491">Serviceability Logs</text>
  <text class="small" x="645" y="517">pipeline</text>

  <rect class="state" x="790" y="456" width="220" height="88" rx="12"/>
  <text class="label" x="900" y="492">Durable outbox</text>
  <text class="small" x="900" y="518">serviceability-logs.db</text>

  <rect class="output" x="1210" y="146" width="190" height="88" rx="12"/>
  <text class="label" x="1305" y="181">Prometheus</text>
  <text class="small" x="1305" y="207">metrics scrape</text>

  <rect class="event" x="1210" y="365" width="190" height="88" rx="12"/>
  <text class="label" x="1305" y="400">Kafka topics</text>
  <text class="small" x="1305" y="426">typed events</text>

  <rect class="output" x="1210" y="532" width="190" height="88" rx="12"/>
  <text class="label" x="1305" y="567">Downstream</text>
  <text class="small" x="1305" y="593">consumers</text>

  <path class="flow" d="M 220 330 L 310 330"/>
  <path class="flow" d="M 500 330 L 525 330 L 525 190 L 550 190"/>
  <path class="flow" d="M 500 330 L 550 330"/>
  <path class="flow" d="M 500 330 L 525 330 L 525 500 L 550 500"/>
  <path class="flow" d="M 740 190 L 790 190"/>
  <path class="flow" d="M 950 190 L 990 190"/>
  <path class="flow" d="M 1110 190 L 1210 190"/>
  <path class="flow" d="M 740 330 L 790 330"/>
  <path class="flow" d="M 1010 330 L 1110 330 L 1110 409 L 1210 409"/>
  <path class="flow" d="M 740 500 L 790 500"/>
  <path class="flow" d="M 1010 500 L 1110 500 L 1110 409 L 1210 409"/>
  <path class="flow" d="M 1305 453 L 1305 532"/>
</svg>
